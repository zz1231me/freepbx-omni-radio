;;; ===== OMNI-RADIO BEGIN (이 표시 사이는 설치 스크립트가 통째로 갈아끼웁니다) =====
;==============================================================================
; 라디오 (FreePBX / Asterisk)
;
;   7200 하나만 기억하면 됩니다. 걸면 채널 목록이 화면에 뜹니다.
;
;     걺 → (콜백) → "채널을 고르세요" → [1]그루브살롱 [2]드론존 → [3]부트리커
;                                              ↓ 번호를 누르면
;                                          그 채널이 나옵니다
;
;     듣는 중에도  1~9  누르면 바로 그 채널로
;                  * 또는 0   채널 목록으로 돌아가기
;                  #          종료
;
;   목록을 세 바퀴 도는 동안 아무것도 안 누르면 끊습니다.
;   듣는 중에 오래 조용하면(기본 2시간) 끊습니다.
;   아무리 오래 듣고 있어도 3시간이면 끊습니다 (max_sec).
;
; 채널이 무엇인지 아는 곳은 /var/lib/asterisk/agi-bin/radio.agi 한 곳뿐입니다.
; 여기에는 채널 이름도 주소도 없습니다. AGI 가 준 것을 틀기만 합니다.
; 채널을 늘리거나 이름을 바꿀 때 이 파일은 건드릴 일이 없습니다.
;
;   번호(기본 7200)는 radio-gen.py 가 from-internal-custom 에 한 줄로 붙입니다.
;   그래서 웹에서 Custom Destination / Misc Application 을 만들 필요가 없습니다.
;   번호를 바꾸려면 stations.json 의 number 를 고치면 됩니다 (저장하면 반영).
;
; 소리는 라디오가 냅니다. 그래서 안내는 전부 화면입니다 — 라디오 위에 대고
; 말하면 방해만 됩니다. 화면 표시를 끄려면 radio-lib,disp 첫 줄의 RD_NODISP.
;==============================================================================

;------------------------------------------------------------------------------
; 7200 진입점 — 콜백 방식
;
;   내가 7200 을 거는 '발신' 통화는 통화 중 화면 갱신이 안 되는 기종이
;   있습니다(내가 발신자라서). 이 라디오는 화면이 곧 메뉴라 그게 안 되면
;   쓸 수가 없습니다. 그래서 받고 잠깐 뒤 끊고, 시스템이 그 내선으로
;   되걸어(콜백) '수신'으로 진행합니다.
;
;   전화기가 발신 중에도 화면을 잘 바꿔 준다면 콜백은 군더더기입니다.
;   그때는 전역 변수 RD_NOCB=1 로 끄면 걸자마자 메뉴가 뜹니다.
;------------------------------------------------------------------------------
[radio-entry]
exten => s,1,NoOp(라디오 진입 from ${CALLERID(num)})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,GotoIf($["${RD_NOCB}" = "1"]?direct)
 ; 내선(PJSIP 엔드포인트)이 아니면 되걸 곳이 없습니다 -> 이 통화에서 바로
 same => n,Set(DS=${DEVICE_STATE(PJSIP/${CALLER})})
 same => n,GotoIf($["${DS}" = "INVALID"]?direct)
 same => n,GotoIf($["${DS}" = "UNKNOWN"]?direct)
 same => n,GotoIf($[${LEN(${CALLER})} < 2]?direct)
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,Set(RD_OK=0)
 same => n,AGI(radio.agi,callback,,,${CALLER})
 ; 콜백 예약이 실패해도 라디오는 들려야 합니다. 이 통화에서 그냥 진행합니다.
 same => n,GotoIf($["${RD_OK}" != "1"]?direct)
 same => n,Wait(1)
 same => n,Hangup()
 same => n(direct),Goto(radio-play,s,1)

;------------------------------------------------------------------------------
; 콜백 발신 — 그 내선을 부릅니다. 받으면 call file 의 Context(radio-play)로.
;   자동 응답은 전화기 자체 Auto Answer 설정에 맡깁니다 (SIP 헤더 안 붙임).
;------------------------------------------------------------------------------
[radio-cb-dial]
exten => _X!,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

;------------------------------------------------------------------------------
; 본체
;
;   MusicOnHold() 가 아니라 StartMusicOnHold() + WaitExten() 을 씁니다.
;   MusicOnHold() 는 DTMF 를 안 받습니다. 그걸 쓰면 채널을 바꾸려고
;   끊고 다시 걸어야 합니다. 이렇게 두면 듣는 중에 숫자를 누르는 순간
;   채널이 바뀝니다. 라디오 다이얼을 돌리는 것과 같습니다.
;------------------------------------------------------------------------------
[radio-play]
exten => s,1,NoOp(라디오 시작 from ${CALLERID(num)} ext=${RD_EXT})
 same => n,Answer()
 ; 전화기가 RTP 를 재생하기 시작할 때까지 잠깐 줍니다 (알람 쪽에서 0.5초는 모자랐습니다)
 same => n,Wait(1)
 same => n,Set(TIMEOUT(digit)=2)
 ; 아무리 오래 들어도 여기서 끊습니다. 수화기가 눌린 채로 있거나 내려놓는 걸
 ; 잊으면 통화가 하루 종일 살아 있게 됩니다. 시간이 되면 T 확장으로 옵니다.
 ; 누구의 라디오인가.
 ;   콜백으로 들어온 통화에서 ${CALLERID(num)} 은 '누가 걸었나'가 아니라
 ;   call file 의 CallerID(=7200) 입니다. 그래서 콜백이 RD_EXT 를 실어 보내고
 ;   여기서 그것을 먼저 씁니다. 콜백을 안 쓸 때(RD_NOCB=1)는 비어 있어서
 ;   그대로 CALLERID(num) 이 됩니다.
 same => n,Set(RD_WHO=${CALLERID(num)})
 same => n,ExecIf($["${RD_EXT}" != ""]?Set(RD_WHO=${RD_EXT}))
 ; 아직 아무 채널도 안 틀었다는 표시. 이게 0 이면 '무입력'은 메뉴로 돌아갑니다.
 same => n,Set(RD_ON=0)
 same => n,Set(RD_STATE=)
 same => n,Set(RD_OK=0)
 ; 채널 목록을 한 번만 받아 옵니다 (통화 중에는 안 바뀝니다).
 same => n,AGI(radio.agi,menu,,${UNIQUEID},${RD_WHO})
 same => n,GotoIf($["${RD_OK}" != "1"]?err,1)
 ; RD_PAGES 가 비면 $[1 > ] 가 되어 조건이 늘 거짓이 되고 무한히 돕니다.
 ; AGI 가 항상 채워 주지만, 못 채운 경로가 생겨도 통화가 갇히면 안 됩니다.
 same => n,ExecIf($["${RD_PAGES}" = ""]?Set(RD_PAGES=0))
 same => n,ExecIf($["${RD_WAIT}" = ""]?Set(RD_WAIT=1))
 same => n,ExecIf($["${RD_MAX}" != ""]?Set(TIMEOUT(absolute)=${RD_MAX}))
 same => n,Set(TRY=0)
 same => n,Goto(menu,1)

;------------------------------------------------------------------------------
; 채널 고르는 화면
;
;   "채널을 고르세요" 를 먼저 띄우고, 채널을 화면 폭에 맞춰 묶어 넘깁니다.
;   AGI 가 이름 길이를 세어 한 화면에 몇 개를 넣을지 정해 줍니다.
;
;   WaitExten 으로 기다리므로 넘기는 도중에 눌러도 바로 잡히고, 아무것도
;   재생하지 않아 듣던 라디오를 안 끊습니다 (듣는 중에 * 로 들어와도
;   소리는 계속 나옵니다).
;
;   세 바퀴를 돌 때까지 아무것도 안 누르면 끊습니다. 무한히 붙잡고 있으면
;   전화기를 잘못 눌러 놓고 자리를 뜬 경우에 통화가 안 끝납니다.
;------------------------------------------------------------------------------
exten => menu,1,Set(RD_STATE=menu)
 same => n,Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} > 3]?bye,1)
 same => n,Gosub(radio-lib,disp,1(채널을 고르세요))
 same => n,Set(I=0)
 ; 화면은 읽는 데 시간이 안 걸립니다. 머리말은 1초만 보여 주고 넘어갑니다.
 same => n,WaitExten(1)
 same => n(next),Set(I=$[${I} + 1])
 ; 한 바퀴 다 돌았으면 처음부터 다시 (TRY 가 하나 올라갑니다)
 same => n,GotoIf($[${I} > ${RD_PAGES}]?menu,1)
 same => n,Gosub(radio-lib,disp,1(${RD_PAGE_${I}}))
 same => n,WaitExten(3)
 same => n,Goto(next)

;------------------------------------------------------------------------------
; 고른 채널을 틉니다
;------------------------------------------------------------------------------
exten => tune,1,Set(RD_OK=0)
 same => n,AGI(radio.agi,tune,${RD_KEY},${UNIQUEID},${RD_WHO})
 same => n,GotoIf($["${RD_OK}" != "1"]?nosuch,1)
 same => n,Gosub(radio-lib,disp,1(${RD_DISPLAY}))
 ; 바꾸기 전에 반드시 멈춥니다. 안 그러면 앞 채널이 겹쳐 들립니다.
 same => n,StopMusicOnHold()
 ; --- 서서히 켜기 ---------------------------------------------------------
 ;   누르자마자 소리가 통째로 튀어나오면 놀랍니다. 한 박자(기본 1초) 쉬고
 ;   세 단계로 올립니다. 쉬는 시간은 stations.json 의 start_wait_ms 로 조절.
 ;
 ;     누름 → (1초 조용) → 1초간 50% → 1초간 80% → 100%
 ;
 ;   찬 채널이 방송에 붙는 데 걸리는 시간도 이 사이에 묻혀서, 여운을 0 으로
 ;   둬도 답답하지 않습니다.
 ;
 ;   VOLUME() 은 소수점을 그대로 받습니다 (atof + ast_frame_adjust_volume_float).
 ;   0.5 = 소리 크기의 절반. dB 가 아니라 배율이라 퍼센트로 그냥 읽으면 됩니다.
 same => n,Wait(${RD_WAIT})
 same => n,Set(VOLUME(TX)=0.5)
 same => n,StartMusicOnHold(${RD_CLASS})
 same => n,Wait(1)
 same => n,Set(VOLUME(TX)=0.8)
 same => n,Wait(1)
 same => n,Set(VOLUME(TX)=1)
 same => n,Set(RD_ON=1)
 ; 채널을 골랐으니 메뉴를 몇 바퀴 돌았는지는 다시 셉니다.
 same => n,Set(TRY=0)
 same => n,Goto(play,1)

; --- 듣는 중. 여기서 다음 키를 기다립니다 -------------------------------------
;     찬 채널을 처음 틀면 방송에 붙는 데 잠깐 걸릴 수 있습니다. 메뉴를 보는
;     동안 미리 데워 두므로 보통은 즉시 나옵니다.
exten => play,1,Set(RD_STATE=play)
 same => n,WaitExten(${RD_IDLE})
 same => n,Goto(bye,1)

;------------------------------------------------------------------------------
; 눌린 키
;
;   Read 가 아니라 WaitExten 으로 받습니다. Read 는 # 을 '입력 끝' 으로 삼아
;   삼켜 버려서, 메뉴에서 # 을 눌러도 아무 일도 안 일어났습니다. WaitExten 은
;   눌린 키를 이 컨텍스트의 확장으로 찾으므로 # 도 그냥 잡힙니다. 덕분에
;   메뉴에서든 듣는 중이든 오입력 안내에서든 키가 똑같이 동작합니다.
;------------------------------------------------------------------------------
exten => _[1-9],1,Set(RD_KEY=${EXTEN})
 same => n,Goto(tune,1)

; 0 은 채널이 아닙니다. 헷갈려 누르는 자리라 목록으로 데려다 줍니다.
exten => 0,1,Goto(menu,1)
exten => *,1,Goto(menu,1)
exten => #,1,Goto(bye,1)

; --- 없는 번호. 통화는 그대로 두고 화면으로만 알립니다 -----------------------
exten => nosuch,1,Set(RD_STATE=nosuch)
 same => n,Gosub(radio-lib,disp,1(${RD_KEY}번 채널은 없습니다))
 ; 안내를 보는 2초 동안에도 제대로 된 번호를 누르면 바로 먹습니다.
 same => n,WaitExten(2)
 same => n,Goto(back,1)

; 안내를 보고 아무것도 안 눌렀을 때 원래 자리로 돌려놓습니다
exten => back,1,GotoIf($["${RD_ON}" != "1"]?menu,next)
 same => n,Gosub(radio-lib,disp,1(${RD_DISPLAY}))
 same => n,Goto(play,1)

;------------------------------------------------------------------------------
; 끝나는 길
;------------------------------------------------------------------------------
; 채널 목록 자체가 깨졌을 때. 무음으로 몇 분을 붙잡고 있는 것보다 바로
; 알리고 끊는 편이 낫습니다. 이유는 /var/log/asterisk/radio.log 에 있습니다.
exten => err,1,Gosub(radio-lib,disp,1(채널 설정 오류))
 same => n,Wait(2)
 same => n,Hangup()

; 아무리 오래 들어도 끊는 자리 (TIMEOUT(absolute) 가 여기로 보냅니다)
exten => T,1,Gosub(radio-lib,disp,1(오래 들으셨습니다))
 same => n,Wait(1)
 same => n,Goto(bye,1)

exten => bye,1,StopMusicOnHold()
 same => n,Gosub(radio-lib,disp,1(라디오 종료))
 same => n,Wait(0.5)
 same => n,Hangup()

; 무입력으로 WaitExten 이 끝나면 여기로 옵니다. 어디서 기다리고 있었느냐에
; 따라 갈립니다 — 메뉴면 다음 장, 오입력 안내면 원래 자리, 듣는 중이면 종료.
exten => t,1,GotoIf($["${RD_STATE}" = "menu"]?menu,next)
 same => n,GotoIf($["${RD_STATE}" = "nosuch"]?back,1)
 same => n,Goto(bye,1)
; 그 밖의 키는 무시하고 있던 자리에 머뭅니다
exten => i,1,Goto(t,1)
; 끊긴 뒤 '이 통화가 듣는 중' 표시를 거둡니다.
; 마지막 청취자였다면 그 채널의 스트림이 여운 시간 뒤에 스스로 멈춥니다.
; 이 한 줄이 안 돌면 아무도 안 듣는 방송을 계속 받게 됩니다.
exten => h,1,AGI(radio.agi,off,,${UNIQUEID},${RD_WHO})

;------------------------------------------------------------------------------
; 전화기 화면에 한 줄 띄우기
;
;   끄고 싶으면 아래 첫 줄을  exten => disp,1,Return()  으로 바꾸면 전부 꺼집니다.
;   기능에는 영향이 없지만, 이 라디오는 화면이 곧 메뉴라 사실상 못 씁니다.
;
;   pres 를 반드시 먼저 설정해야 합니다. 기본값이 'unavailable' 이라 그대로
;   두면 Asterisk 가 "표시할 수 없는 정보"로 보고 PAI/RPID 를 아예 안 실어
;   보냅니다. send_pai=yes 를 켜도 화면이 안 바뀌는 원인입니다.
;------------------------------------------------------------------------------
[radio-lib]
exten => disp,1,GotoIf($["${RD_NODISP}" = "1"]?skip)
 same => n,Set(CONNECTEDLINE(pres)=allowed_not_screened)
 same => n,Set(CONNECTEDLINE(name-charset)=utf8)
 same => n,Set(CONNECTEDLINE(num)=${RD_NUM})
 same => n,Set(CONNECTEDLINE(name)=${ARG1})
 same => n(skip),Return()
;;; ===== OMNI-RADIO END =====
